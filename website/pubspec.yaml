name: party_hub_website
description: 康师傅聚会游戏的下载网站。
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
    - assets/peep_00.png
    - assets/peep_05.png
    - assets/peep_09.png
  fonts:
    - family: PartySans
      fonts:
        - asset: assets/fonts/PartySans.ttf
