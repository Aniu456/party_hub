name: Android Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example v1.0.0+1'
        required: true
        type: string

# Publish one version at a time so an older build cannot overwrite latest.
concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Validate version and signing configuration
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PARTY_HUB_WS: ${{ secrets.PARTY_HUB_WS }}
        run: |
          python3 tool/check_public_files.py
          python3 tool/release_metadata.py --tag "$RELEASE_TAG" --check-remote
          test -n "$KEYSTORE" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || {
            echo '::error::Missing Android signing secrets. See docs/android-releases.md.'
            exit 1
          }
          test -n "$PARTY_HUB_WS" || { echo '::error::Missing PARTY_HUB_WS secret'; exit 1; }

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Resolve dependencies and verify
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
          python3 -m unittest discover -s test -p 'release_metadata_test.py'

      - name: Restore signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          os.umask(0o077)
          Path('android/release.jks').write_bytes(base64.b64decode(os.environ['KEYSTORE'], validate=True))
          def escape(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r').replace(' ', '\\ ')
          properties = {
              'storeFile': 'release.jks',
              'storePassword': os.environ['STORE_PASSWORD'],
              'keyAlias': os.environ['KEY_ALIAS'],
              'keyPassword': os.environ['KEY_PASSWORD'],
          }
          Path('android/key.properties').write_text(''.join(f'{key}={escape(value)}\n' for key, value in properties.items()))
          PY

      - name: Build signed universal APK
        env:
          PARTY_HUB_WS: ${{ secrets.PARTY_HUB_WS }}
        run: |
          flutter build apk --release --dart-define="PARTY_HUB_WS=$PARTY_HUB_WS"
          mkdir -p build/release
          cp build/app/outputs/flutter-apk/app-release.apk build/release/party-hub.apk
          python3 tool/release_metadata.py --tag "$RELEASE_TAG" --apk build/release/party-hub.apk

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Recheck after building; fail closed if latest changed during this run.
          python3 tool/release_metadata.py --tag "$RELEASE_TAG" --check-remote
          if gh release view "$RELEASE_TAG" --json isDraft > build/release-state.json 2> build/release-error.txt; then
            python3 -c 'import json; assert json.load(open("build/release-state.json"))["isDraft"], "Published releases must never be replaced"'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "康师傅 $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" build/release/party-hub.apk build/release/update.json build/release/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest

      - name: Remove signing material
        if: always()
        run: rm -f android/release.jks android/key.properties
