name: Android Auto Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never interrupt an upload; the server also serializes publication.
concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOWNLOAD_BASE: ${{ secrets.PARTY_HUB_DOWNLOAD_BASE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate configuration and current main revision
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PARTY_HUB_WS: ${{ secrets.PARTY_HUB_WS }}
          DEPLOY_KEY: ${{ secrets.PARTY_HUB_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.PARTY_HUB_DEPLOY_HOST }}
          KNOWN_HOSTS: ${{ secrets.PARTY_HUB_DEPLOY_KNOWN_HOSTS }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA" || {
            echo '::error::This run is no longer the current main revision.'; exit 1;
          }
          python3 tool/check_public_files.py
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          os.umask(0o077)
          for key in ['DOWNLOAD_BASE', 'PARTY_HUB_WS', 'KEYSTORE', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD', 'DEPLOY_KEY', 'DEPLOY_HOST', 'KNOWN_HOSTS']:
              if not os.environ.get(key):
                  raise SystemExit('Missing configuration: ' + key)
          Path('.env.production.json').write_text(json.dumps({
              'PARTY_HUB_WS': os.environ['PARTY_HUB_WS'],
              'PARTY_HUB_DOWNLOAD_BASE': os.environ['DOWNLOAD_BASE'],
          }))
          Path(os.environ['RUNNER_TEMP'], 'publish.key').write_text(os.environ['DEPLOY_KEY'] + '\n')
          Path(os.environ['RUNNER_TEMP'], 'publish.hosts').write_text(os.environ['KNOWN_HOSTS'] + '\n')
          PYTHON

      - name: Allocate the next Android build number
        id: version
        run: python3 tool/publish_release.py --prepare

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Resolve dependencies and verify
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
          python3 -m unittest discover -s test -p '*release*test.py'
          cd website
          flutter pub get --enforce-lockfile
          flutter test

      - name: Restore signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          os.umask(0o077)
          Path('android/release.jks').write_bytes(base64.b64decode(os.environ['KEYSTORE'], validate=True))
          def escape(value):
              slash = chr(92)
              return value.replace(slash, slash + slash).replace(chr(10), slash + 'n').replace(chr(13), slash + 'r').replace(' ', slash + ' ')
          properties = {
              'storeFile': 'release.jks',
              'storePassword': os.environ['STORE_PASSWORD'],
              'keyAlias': os.environ['KEY_ALIAS'],
              'keyPassword': os.environ['KEY_PASSWORD'],
          }
          Path('android/key.properties').write_text(''.join(f'{key}={escape(value)}\n' for key, value in properties.items()))
          PY

      - name: Build signed APK, website and OTA bundle
        run: python3 tool/build_release.py

      - name: Publish to the download server and verify public APK
        env:
          GH_TOKEN: ${{ github.token }}
          PARTY_HUB_DEPLOY_HOST: ${{ secrets.PARTY_HUB_DEPLOY_HOST }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA" || {
            echo '::error::A newer commit is queued; refusing to publish this obsolete build.'; exit 1;
          }
          python3 tool/publish_release.py \
            --archive "build/releases/$RELEASE_TAG/party-hub-$RELEASE_TAG-website-android.zip" \
            --identity "$RUNNER_TEMP/publish.key" --known-hosts "$RUNNER_TEMP/publish.hosts"
          echo "Published and verified $RELEASE_TAG on the configured download server." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing and deployment material
        if: always()
        run: rm -f android/release.jks android/key.properties .env.production.json "$RUNNER_TEMP/publish.key" "$RUNNER_TEMP/publish.hosts"
